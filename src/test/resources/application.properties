# Each Spring test context gets its own index directory (Lucene allows one writer per directory).
app.lucene.index-dir=target/lucene-test/${random.uuid}
# Tests call IndexWorker.processPending() themselves; keep the scheduler out of the way.
app.index.poll-ms=3600000
# HS256 needs >= 32 bytes.
app.jwt.secret=test-secret-that-is-long-enough-for-hs256
app.admin-email=admin@example.com
