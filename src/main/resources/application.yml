spring:
  application:
    name: data-wiki
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datawiki}
    username: ${DB_USER:datawiki}
    password: ${DB_PASSWORD:datawiki}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_FILE_SIZE:1MB}
      max-request-size: ${IMPORT_MAX_REQUEST_SIZE:50MB}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.datawiki: ${LOG_LEVEL:INFO}

app:
  lucene:
    index-dir: ${LUCENE_INDEX_DIR:./lucene-index}
    stemming: ${LUCENE_STEMMING:true}
  index:
    poll-ms: ${INDEX_POLL_MS:1000}
    batch-size: ${INDEX_BATCH_SIZE:100}
    max-attempts: ${INDEX_MAX_ATTEMPTS:5}
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:300}
  admin-email: ${ADMIN_EMAIL:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  import:
    max-file-bytes: ${IMPORT_MAX_FILE_BYTES:1048576}
